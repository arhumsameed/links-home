name: Links-Home CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system streamlit pandas numpy scikit-learn torch plotly

    - name: Run Data & Model Verification Test
      run: |
        python -c "import pandas as pd; df = pd.read_csv('iot_cold_chain_logistics.csv'); print('Dataset verified successfully with rows:', len(df))"
        python -c "import torch; print('PyTorch version:', torch.__version__)"

    - name: Test Python Script Syntax
      run: |
        python -m py_compile cold_chain.py
        echo "Script syntax check passed successfully."
