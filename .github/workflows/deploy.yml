name: Links-Home CI

# Runs on every push and pull request to master.
# Deployment: the app is hosted on Streamlit Community Cloud, which
# redeploys automatically whenever master changes and these checks pass.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Check syntax
      run: python -m py_compile pipeline.py cold_chain.py

    - name: Run tests (data checks and model smoke test)
      run: python -m pytest -q
